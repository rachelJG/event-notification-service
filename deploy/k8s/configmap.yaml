apiVersion: v1
kind: ConfigMap
metadata:
  name: event-service-config
  labels:
    app.kubernetes.io/name: event-service
data:
  API_ADDR: ":8080"
  APP_ENV: "production"
  LOG_LEVEL: "info"
  MAX_BODY_BYTES: "1048576"
  RATE_LIMIT_RPS: "10"
  RATE_LIMIT_BURST: "20"
  READ_HEADER_TIMEOUT: "5"
  READ_TIMEOUT: "15"
  WRITE_TIMEOUT: "15"
  IDLE_TIMEOUT: "60"
  DB_QUERY_TIMEOUT: "5"
  DB_POOL_MAX_CONNS: "10"
  DB_POOL_MIN_CONNS: "2"
  DB_POOL_MAX_CONN_LIFETIME: "3600"
  DB_POOL_MAX_CONN_IDLE_TIME: "1800"
  CORS_ALLOW_ALL: "false"
  CORS_ALLOWED_ORIGINS: ""
  CORS_ALLOWED_HEADERS: "Origin,Content-Length,Content-Type,Idempotency-Key,Authorization"
  HSTS_ENABLED: "true"
  HSTS_MAX_AGE_SECONDS: "31536000"
  SMTP_PORT: "587"
  WORKER_PROCESS_INTERVAL: "5s"
  WORKER_DELIVER_INTERVAL: "3s"
  WORKER_BATCH_SIZE: "50"
