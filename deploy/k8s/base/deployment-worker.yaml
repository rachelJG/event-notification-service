apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service-worker
  labels:
    app.kubernetes.io/name: event-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-service
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-service
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: event-service-worker:latest
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: event-service-config
            - secretRef:
                name: event-service-secret
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
