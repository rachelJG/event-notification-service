apiVersion: v1
kind: Secret
metadata:
  name: event-service-secret
  labels:
    app.kubernetes.io/name: event-service
type: Opaque
stringData:
  PG_DSN: "postgres://user:password@postgres:5432/events?sslmode=require"
  JWT_SECRET: "CHANGE-ME-must-be-at-least-32-bytes-long"
  SMTP_HOST: "smtp.example.com"
  SMTP_USER: "notifications@example.com"
  SMTP_PASSWORD: "CHANGE-ME"
  SMTP_FROM: "notifications@example.com"
