global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "event-notification-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  - job_name: "event-notification-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
